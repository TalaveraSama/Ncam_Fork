# =============================================================================
#  NCam-NG :: configuración óptima para 3 CAID separados (1801, 1861, 0B00)
# =============================================================================
#
#  Objetivo: la respuesta MÁS RÁPIDA posible y una caché que guarde todos los
#  CW que entregan los lectores, con permisos por CAID para cada usuario.
#
#  - [global]  → rendimiento y balanceo
#  - [cache]   → motor de caché v2 (lo que hace que no se repita la petición)
#  - [cccam]   → puerto CCcam para tus clientes (reseller / usuarios)
#  - [newcamd] → puerto Newcamd opcional para clientes que no usen CCcam
#  - [webif]   → WebIf + NCPanel (el panel lee el motor de caché por aquí)
#
#  Los lectores van en  ncam.server  y los usuarios en  ncam.user
#  (tienes ejemplos de los tres ficheros en /usr/share/doc/ncam-ng/examples/)
#
#  Guía completa: /usr/share/doc/ncam-ng/configuracion-optima.md
# =============================================================================

[global]
# --- registro ---------------------------------------------------------------
logfile                       = /var/log/ncam/ncam.log
# 0 = no borrar el registro; con valor en KB rota al superarlo
maxlogsize                    = 2480
# prioridad de CPU: negativo = más prioridad (más rápido atendiendo ECM)
nice                          = -10
# descomenta para mandar el registro a syslog (útil con servidores remotos)
#sysloghost                   = 127.0.0.1

# --- tiempos de respuesta (aquí está la velocidad) --------------------------
# máximo que se espera a un cliente que pide algo (7 s)
clienttimeout                 = 7000
# si un lector no responde en 2 s se pasa al siguiente (bajar = más rápido,
# pero corta lectores lentos; 1500-3000 es el rango bueno)
fallbacktimeout               = 2000
# cerrar clientes inactivos (segundos)
clientmaxidle                 = 300
# espera al arrancar a que los puertos queden libres
bindwait                      = 60

# --- caché: lo que hace que la segunda vez sea instantánea ------------------
# La caché interna SIEMPRE se consulta antes de molestar a ningún lector: si el
# ECM está en la caché, se responde al instante. No hay que activar nada.
# preferlocalcards: 0 = preguntar a todos los lectores a la vez
#                   1 = preguntar antes a las tarjetas locales (recomendado si
#                       tienes una tarjeta física)
#                   2 = como 1, pero además NO se usan los peers de cacheex como
#                       primera opción (no lo pongas si compartes caché)
preferlocalcards              = 1
# desconectar inicios de sesión duplicados del mismo usuario (evita que dos
# equipos compartan una línea; con uniq = 2 se permite desde la misma IP)
dropdups                      = 1
# sin tarjeta física en la máquina: no esperar a lectores locales
waitforcards                  = 0
waitforcards_extra_delay      = 200
# reiniciar lectores que caen (segundos)
readerrestartseconds          = 20

# --- balanceo entre lectores (si tienes varios para el mismo CAID) ----------
# 1 = reparte por estadísticas (rápido y estable)
lb_mode                       = 1
# guardar/recuperar las estadísticas del balanceo entre reinicios
lb_save                       = 100
# pedir a 2 lectores como máximo a la vez (menos = más rápido de media)
lb_nbest_readers              = 2
lb_nfb_readers                = 2
lb_min_ecmcount               = 3
lb_max_ecmcount               = 200
lb_reopen_seconds             = 120
lb_retrylimit                 = 500
lb_stat_cleanup               = 24
lb_max_readers                = 3

# --- CW sin CRC -------------------------------------------------------------
# Muchos proveedores mandan el CW con el CRC mal a propósito ("crccws"). Con
# esto NCam lo acepta y no pierdes ECM por "not found".
# Si prefieres tocarlo solo en algunos CAID, borra esta línea y usa, por ejemplo:
#   disablecrccws_only_for      = 1801:000000;1861:000000;0B00:000000
disablecrccws                 = 1

# --- formato del registro de ECM (cómodo para diagnosticar) -----------------
ecmfmt                        = P: c:0p:s:d:i #ECM_L:l #CW=w HOP:j

# --- CCcam: leer la configuración de un servidor CCcam remoto --------------
# 1 = NCam puede leer la config de un CCcam (ficheros .cfg del proveedor)
cccam_cfg_enabled             = 1
cccam_cfg_save                = 1
cccam_cfg_reconnect_delay     = 90
cccam_cfg_reconnect_attempts  = 10


[cache]
# ---------------------------------------------------------------------------
#  Motor de caché v2 de NCam-NG: aquí se guardan todos los CW que entregan
#  los lectores para servir al instante las siguientes peticiones iguales.
# ---------------------------------------------------------------------------
# milisegundos de espera antes de contestar con un CW de la caché. 0 = al
# instante (lo más rápido). Súbelo a 120 solo si tienes tarjeta local en la
# máquina y ves "CW cycles": ese margen deja llegar antes al CW de la tarjeta
delay                         = 0
# validez de una entrada de caché (segundos). 15 = valor recomendado: cubre el
# hueco entre refrescos de ECM sin servir nunca un CW viejo
max_time                      = 15
# capacidad máxima de entradas. 0 = SIN LÍMITE: guarda todo hasta que caduque
# por max_time (lo mejor para que "la caché no se pierda"). Si prefieres acotar
# memoria, pon un número (ej. 20000): al llenarse expulsa primero la usada hace
# más tiempo (LRU)
max_entries                   = 0
# memoria de aciertos para cacheex (segundos): recuerda durante 15 s que ese
# caid/prid/srvid ya se sirvió. 0 = desactivar. Solo tiene efecto con cacheex
max_hit_time                  = 15
# contadores de cacheex por cliente en el WebIf (0 = no contarlos).
# Las estadísticas del motor v2 (entradas, hits, ratio) se ven SIEMPRE en
# cacheengine.html y en NCPanel, con o sin esta opción
cacheexenablestats            = 0
# no tirar CW distintos que lleguen del proveedor (guardar el bueno)
cacheex_dropdiffs             = 0
# 0 = aceptar también entradas de caché que vengan de otros (cacheex)
cacheex_localgenerated_only   = 0

# Si compartes caché con otros servidores (cacheex), añade además:
#cacheex_mode1_delay          = 1801:120,1861:120,0B00:120
#cw_cache_size                 = 8192
#cw_cache_memory               = 8
#ecm_cache_size                = 8192
#ecm_cache_memory              = 8
#ecm_cache_droptime            = 0


[monitor]
port                          = 988
nocrypt                       = 1
aulow                         = 120
hideclient_to                 = 15
monlevel                      = 1


[cccam]
# ---------------------------------------------------------------------------
#  Servidor CCcam: por aquí se conectan tus clientes/revendedores.
# ---------------------------------------------------------------------------
port                          = 12000
# IDENTIFICADOR DEL SERVIDOR: cámbialo por uno tuyo, 16 dígitos hexadecimales,
# y NO lo cambies después (los nodos CCcam se reconocen por él).
# Genera uno con:  openssl rand -hex 8
nodeid                        = 0123456789ABCDEF
# versión que se anuncia a los clientes (2.3.2 = la más compatible)
version                       = 2.3.2
# 0 = tus tarjetas no se pueden reenviar más allá del cliente
# 1-5 = niveles de reenvío permitidos (súbelo si tus clientes revenden)
reshare                       = 0
# no revelar información interna del servidor a los clientes
stealth                       = 1
# mantener los clientes conectados (evita reconexiones constantes)
keepconnected                 = 1
# cada cuánto se reenvía la lista de tarjetas a los clientes (segundos)
updateinterval                = 3600
# 0 = enviar todas las tarjetas (no "minimizar"); con 1 se manda la lista
# mínima, útil si el cliente tiene muchos servidores
minimizecards                 = 0
# marcar los SID que ese proveedor no puede servir: el cliente los ve como no
# disponibles en vez de quedarse esperando (menos cortes)
autosidblock                  = 1
recv_timeout                  = 20


[newcamd]
# ---------------------------------------------------------------------------
#  Opcional: mismo servicio en protocolo Newcamd (por si algún cliente no usa
#  CCcam). Un solo puerto puede dar los tres CAID.
# ---------------------------------------------------------------------------
port                          = 50000@1801,1861,0B00
key                           = 0102030405060708091011121314
mgclient                      = 1
# descomenta para que los clientes Newcamd vean las tarjetas como un solo node
#keepalive                    = 0

# Otros protocolos (descomenta si los necesitas):
#[cs378x]
#port                         = 13001@1801,1861,0B00
#suppresscmd08                = 1
#[camd35]
#port                         = 33333
#suppresscmd08                = 1


[webif]
# ---------------------------------------------------------------------------
#  WebIf: la página donde ves los lectores, los usuarios y la caché.
#  NCPanel lee de aquí las estadísticas del motor de caché.
# ---------------------------------------------------------------------------
httpport                      = 8181
httpuser                      = admin
httppwd                       = CAMBIA_ESTA_CLAVE
httprefresh                   = 30
httppollrefresh               = 30
httpshowmeminfo               = 1
httpshowuserinfo              = 1
httpshowcacheexinfo           = 1
httpshowecminfo               = 1
httpshowloadinfo              = 1
http_status_log               = 1
# solo la propia máquina y la red local (añade tu VPN si la usas)
httpallowed                   = 127.0.0.1,10.0.0.0-10.255.255.255,172.16.0.0-172.31.255.255,192.168.0.0-192.168.255.255


# =============================================================================
#  DVBAPI: solo si en esta misma máquina ves la TV (descodificador con Enigma2
#  o VLC). Si es un servidor para dar líneas, déjalo descomentado sin usar.
# =============================================================================
#[dvbapi]
#enabled                     = 0
#au                          = 1
#pmt_mode                    = 0
#request_mode                = 1
#extended_cw_api             = 2
#boxtype                     = dreambox
#user                        = dvbapiau
