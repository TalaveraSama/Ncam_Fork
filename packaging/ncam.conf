# ---------------------------------------------------------------------------
# NCam-NG :: configuración del daemon instalada por el paquete .deb
#
# Este fichero es un "conffile": dpkg respeta tus cambios al actualizar.
# La configuración completa de referencia está en
#   /usr/share/doc/ncam-ng/examples/ncam.conf
# y la de los lectores en .../ncam.server
# ---------------------------------------------------------------------------

[global]
logfile                       = /var/log/ncam/ncam.log
nice                          = -1
maxlogsize                    = 2480

[cache]
# Motor de caché v2 (NCam-NG). La caché se consulta siempre antes de molestar a
# los lectores; estos valores son los recomendados para que no se pierda nada.
# delay = milisegundos de espera antes de contestar desde la caché (0 = al
# instante; 120 si tienes tarjeta local y ves ciclos de CW)
delay                         = 0
max_time                      = 15
max_hit_time                  = 15
# 0 = sin límite de contenedores (se guarda todo hasta que caduque por
# max_time); con valor > 0 se expulsa primero lo menos usado (LRU)
max_entries                   = 0
# contadores de cacheex por cliente en el WebIf (1 solo si compartes caché:
# las estadísticas del motor se ven siempre en cacheengine.html y NCPanel)
cacheexenablestats            = 0

[monitor]
port                          = 988
nocrypt                       = 1
aulow                         = 120
hideclient_to                 = 15
monlevel                      = 1

[webif]
httpport                      = 8181
httpuser                      = admin
# Cambia esta contraseña: el panel la necesita para leer el motor de caché
httppwd                       = ncam
httprefresh                   = 30
httppollrefresh               = 30
httpallowed                   = 127.0.0.1,192.168.0.0-192.168.255.255,172.16.0.0-172.31.255.255,10.0.0.0-10.255.255.255
http_status_log               = 1

# Los lectores y las cuentas van en ncam.server y ncam.user
# (ejemplos en /usr/share/doc/ncam-ng/examples/)
